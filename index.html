<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Calendar App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fff;
      width: 100%;
      height: 100vh;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .content {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 20px;
    }
    .note {
      color: #999;
      font-size: 12px;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Google Calendar App</h1>
      <p>Diese App wird direkt mit Google Calendar verbunden</p>
      <p>Falls Sie diese Seite sehen, starten Sie die App mit:</p>
      <code>npm start</code>
      <div class="note">
        <strong>Hinweis:</strong> Die App lädt https://calendar.google.com automatisch.
        Diese HTML-Datei dient als Fallback-Shell für die Projektstruktur.
      </div>
    </div>
  </div>
</body>
</html>
